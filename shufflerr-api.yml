components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    AlbumDetails:
      type: object
      properties:
        releaseMbid:
          type: string
          nullable: true
          description: The MusicBrainz release (edition) the tracklist comes from.
        label:
          type: string
        discCount:
          type: number
        totalLengthMs:
          type: number
        genres:
          type: array
          items:
            type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/AlbumTrack'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestSummary'
          description: Requests for this album the viewer may see, newest first.
        discographyRequest:
          $ref: '#/components/schemas/RequestSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ExternalLink'
        lidarr:
          type: object
          properties:
            serverId:
              type: number
            albumId:
              type: number
              nullable: true
            artistId:
              type: number
              nullable: true
            monitored:
              type: boolean
            canRemove:
              type: boolean
              description: The viewer may call DELETE /media/:id/lidarr (request managers).
          required:
            - serverId
            - monitored
          nullable: true
        openIssues:
          type: number
          description: Open issues count (backlog UI).
        mbid:
          type: string
          description: Release-group MBID
        title:
          type: string
        artistMbid:
          type: string
        artistName:
          type: string
        artistCredit:
          type: array
          items:
            $ref: '#/components/schemas/ArtistCredit'
        primaryType:
          type: string
          description: Album / Single / EP / Broadcast / Other
        secondaryTypes:
          type: array
          items:
            type: string
        firstReleaseDate:
          type: string
          description: YYYY or YYYY-MM-DD
        year:
          type: number
        coverUrl:
          type: string
          nullable: true
          description: '`/imageproxy/caa/release-group/<mbid>/front-500` (or media-server art), or null.'
        status:
          type: number
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
        trackCount:
          type: number
          nullable: true
        tracksAvailable:
          type: number
        mediaInfo:
          $ref: '#/components/schemas/MediaInfoSummary'
        request:
