  /user/{id}/recently-played:
    get:
      tags:
        - Users
      summary: '"Recently played" on the profile: the user''s real play history. Plays are'
      description: |-
        "Recently played" on the profile: the user's real play history. Plays are
        recorded by the scrobble pipeline (web player, connected apps, media-server
        webhooks); the list stays empty until something has been played.

        Requires a signed-in user.
      operationId: getUserByIdRecentlyPlayed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: take
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: False when the integration behind this row is off — the UI hides the row.
                  reason:
                    type: string
                    description: Why it is empty/off, safe to show to admins.
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlayResult'
                  sources:
                    type: array
                    items:
                      type: string
                      enum:
                        - plex
                        - jellyfin
                        - navidrome
                        - apps
                        - web
                    description: Sources feeding the list, for the sub-line ("From Plex and connected apps.").
                  scrobblingTo:
                    type: array
                    items:
                      type: string
                      enum:
                        - lastfm
                        - listenbrainz
                    description: Linked + enabled scrobble targets ("Scrobbling to ListenBrainz and Last.fm").
                required:
                  - enabled
                  - results
                  - sources
                  - scrobblingTo
        '401':
          description: Not signed in
