    UserRequestsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              status:
                type: number
                enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
              scope:
                type: string
                enum:
                  - tracks
                  - album
                  - discography
              media:
                $ref: '#/components/schemas/Media'
              requestedBy:
                $ref: '#/components/schemas/User'
              modifiedBy:
                allOf:
                  - $ref: '#/components/schemas/User'
                nullable: true
                description: Who approved/declined; the requester when auto-approved.
                type: object
              isAutoApproved:
                type: boolean
              isAutoRequest:
                type: boolean
              ignoreQuota:
                type: boolean
              releaseCount:
                type: number
                description: 'Discography: number of release groups included (counts against the album quota).'
              trackCount:
                type: number
                description: 'Tracks scope: number of tracks requested (counts against the track quota).'
              tracks:
                type: array
                items:
                  $ref: '#/components/schemas/TrackRequest'
              serverId:
                type: number
                nullable: true
                description: Lidarr instance (default when null).
              qualityProfileId:
                type: number
                nullable: true
              metadataProfileId:
                type: number
                nullable: true
              rootFolder:
                type: string
                nullable: true
              isHiRes:
                type: boolean
              monitorFuture:
                type: boolean
              downloadProgress:
                type: number
                nullable: true
                description: 0–100 from the download sync job.
              failureReason:
                type: string
                nullable: true
              declineReason:
                type: string
                nullable: true
              coverUrl:
                type: string
                nullable: true
                description: '`/imageproxy/...` cover (release group) or artist photo (discography), or null.'
              profileName:
                type: string
                description: Quality profile name on the target Lidarr server, when resolvable.
              canRemove:
                type: boolean
                description: The viewer may cancel/delete this request.
              canManage:
                type: boolean
                description: The viewer may approve/decline/retry.
              lastChange:
                type: string
                description: >-
                  "Approved automatically" | "Approved by <name>" | "Declined by <name>" | "Failed after
                  approval" | "No changes yet"
              playable:
                type: boolean
                description: True when every requested track is playable from the library.
            required:
              - id
              - createdAt
              - updatedAt
              - status
              - scope
              - media
              - requestedBy
              - isAutoApproved
              - isAutoRequest
              - ignoreQuota
              - releaseCount
              - trackCount
              - tracks
              - isHiRes
              - monitorFuture
              - coverUrl
              - canRemove
              - canManage
              - lastChange
              - playable
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
        - results
        - pageInfo
    UserResultsResponse:
