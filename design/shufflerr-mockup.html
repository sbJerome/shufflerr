<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shufflerr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F6FA;--surface:#FFFFFF;--raised:#FFFFFF;--hover:#EBEFF5;--line:#DDE3EC;--line-2:#C9D2DE;
  --text:#121826;--muted:#4A5566;--faint:#5C6878;--accent:#D6002A;--on-accent:#FFFFFF;--link:#C4002A;
  --rail:#FFFFFF;--scrim:244,246,250;--slot:#E3E8F0;--slot-ink:#8A96A8;
  --st-available:#0B7F74;--st-partial:#2E7D32;--st-processing:#3557C4;--st-pending:#9A6400;--st-declined:#C0392B;--st-none:#5C6878;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C101B;--surface:#10151F;--raised:#141A26;--hover:#1A2131;--line:#1E2636;--line-2:#283143;
  --text:#E9EEF4;--muted:#9CA8B0;--faint:#7F8A9A;--accent:#FF1744;--on-accent:#0C101B;--link:#FF5C7A;
  --rail:#090C14;--scrim:16,21,31;--slot:#1A2131;--slot-ink:#3A4458;
  --st-available:#5FD3C6;--st-partial:#7FD08A;--st-processing:#9DB4FF;--st-pending:#F5B83D;--st-declined:#F08C7A;--st-none:#7F8A9A;
}}
:root[data-theme="dark"]{
  --bg:#0C101B;--surface:#10151F;--raised:#141A26;--hover:#1A2131;--line:#1E2636;--line-2:#283143;
  --text:#E9EEF4;--muted:#9CA8B0;--faint:#7F8A9A;--accent:#FF1744;--on-accent:#0C101B;--link:#FF5C7A;
  --rail:#090C14;--scrim:16,21,31;--slot:#1A2131;--slot-ink:#3A4458;
  --st-available:#5FD3C6;--st-partial:#7FD08A;--st-processing:#9DB4FF;--st-pending:#F5B83D;--st-declined:#F08C7A;--st-none:#7F8A9A;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}

/* shell */
.app{display:flex;min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 76px);flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;background:var(--rail);border-right:1px solid var(--line)}
.brand{width:44px;height:44px;display:grid;place-items:center;margin-bottom:18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:-.04em}
.brand:hover{text-decoration:none}
.rail a.nav{position:relative;width:48px;height:48px;display:grid;place-items:center;border-radius:12px;color:var(--faint)}
.rail a.nav:hover{background:var(--hover);color:var(--text);text-decoration:none}
.rail a.nav[aria-current="page"]{background:var(--hover);color:var(--accent)}
.rail .count{position:absolute;top:6px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:700 10px/17px var(--mono);text-align:center}
.rail .grow{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:96px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 32px;border-bottom:1px solid var(--line)}
.searchbox{flex:1 1 320px;max-width:620px;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--raised);border:1px solid var(--line-2);border-radius:10px}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.searchbox input::placeholder{color:var(--faint)}
.searchbox kbd{font:11px var(--mono);color:var(--faint);padding:2px 6px;border:1px solid var(--line-2);border-radius:4px}
.top .spacer{flex:1}
.pill{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:transparent;font-size:14px;color:var(--text)}
.pill:hover{background:var(--hover);text-decoration:none}
.avatar{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--slot);color:var(--muted);font:700 12px var(--mono)}
.view{padding:32px;max-width:1400px;width:100%;display:flex;flex-direction:column;gap:48px}

/* type */
h1,h2,h3{margin:0;line-height:1.1}
.h-section{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--faint);margin:4px 0 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.crumb{font:13px var(--mono);color:var(--faint)}
.crumb a{color:var(--muted)}

/* buttons */
.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:8px;border:1px solid var(--line-2);background:transparent;font-weight:600;font-size:14px;color:var(--text)}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.small{min-height:40px;padding:0 14px;font-size:13px}
.btn.ghost-accent{border-color:var(--accent);color:var(--accent)}
.btn.ok{border-color:var(--st-available);color:var(--st-available)}
.btn.no{border-color:var(--st-declined);color:var(--st-declined)}
.btn[disabled]{opacity:.55;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-2);background:transparent;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--hover)}
.chip .n{color:var(--faint);margin-left:4px;font-family:var(--mono);font-size:12px}

/* status */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* art slots */
.cover{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--tint,var(--slot));display:grid;place-items:center;color:var(--ink,var(--slot-ink))}
.cover svg{width:30%;height:30%;opacity:.7}
.cover .cap{position:absolute;left:10px;bottom:8px;font:10px var(--mono);opacity:.85}
.cover .badge{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:12px;background:rgba(9,12,20,.82);font-size:11px;font-weight:600;color:var(--c)}
.cover.round{border-radius:50%}
.thumb{width:48px;height:48px;flex:none;border-radius:6px}
.thumb svg{width:44%;height:44%}

/* hero */
.hero{position:relative;margin:-32px -32px 0;min-height:480px;padding:56px 32px 36px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.hero .photo{position:absolute;top:0;right:0;bottom:0;width:62%;background:var(--slot);color:var(--slot-ink);display:grid;place-items:center}
.hero .photo svg{width:240px;height:240px}
.hero .photo .cap{position:absolute;right:24px;top:20px;font:11px var(--mono);color:var(--faint)}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--scrim)) 34%,rgba(var(--scrim),.55) 62%,rgba(var(--scrim),.12))}
.hero .fade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(0deg,var(--bg),transparent)}
.hero .content{position:relative;max-width:640px;display:flex;flex-direction:column;gap:16px}
.hero .kicker{font-size:14px;font-weight:600;color:var(--accent)}
.hero h1{font-size:clamp(48px,7vw,84px);font-weight:700;letter-spacing:-.04em;line-height:.92}
.hero .by{font-size:17px;color:var(--muted)}
.hero .by a{color:var(--text);font-weight:600}
.hero p.blurb{margin:0;max-width:520px;color:var(--muted)}
.hero .stats{position:relative;display:flex;flex-wrap:wrap;gap:6px 28px;margin:10px 0 0;padding:0}
.hero .stats div{display:flex;align-items:baseline;gap:8px}
.hero .stats dd{margin:0;font:700 20px var(--mono)}
.hero .stats dt{font-size:13px;color:var(--faint)}

/* rows & grids */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(176px,212px);gap:20px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.row>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:24px 20px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card .t{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:13px;color:var(--muted)}
.card>a:first-child:hover{text-decoration:none}
.artist-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--text)}
.artist-card:hover{text-decoration:none}
.artist-card .m{font-size:13px;color:var(--faint)}

/* lists/tables */
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.scroll-x{overflow-x:auto}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.list .who{flex:0 1 180px;font-size:13px;color:var(--faint)}
.table{min-width:760px}
.tr{display:grid;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-height:58px}
.tr:last-child{border-bottom:0}
.tr.head{min-height:0;padding:12px 16px;font-size:12px;font-weight:600;color:var(--faint)}
.tr .num{font:13px var(--mono);color:var(--faint)}
.tr .dim{color:var(--muted);font-size:13px}
.tr .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tr.missing .title{color:var(--muted)}
.title{font-weight:600}
.feat{font-size:13px;color:var(--muted)}

/* detail header */
.detail{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end}
.detail .art{width:280px;flex:none}
.detail .info{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.detail h1{font-size:clamp(40px,5vw,64px);font-weight:700;letter-spacing:-.035em}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:4px 12px;border-radius:14px;background:var(--hover);font-size:13px;color:var(--muted)}
.progress{height:6px;max-width:420px;border-radius:3px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--st-partial)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0;flex:1 1 260px;max-width:380px}
.facts div{padding:14px 16px;background:var(--surface)}
.facts dt{font-size:12px;color:var(--faint)}
.facts dd{margin:2px 0 0;font:700 24px var(--mono)}
.two{display:flex;flex-wrap:wrap;gap:32px}
.two>.wide{flex:2 1 480px}
.two>.narrow{flex:1 1 280px}
.kv{display:flex;flex-direction:column;gap:10px;padding:16px;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:16px}
.kv dt{color:var(--faint)}.kv dd{margin:0;font-family:var(--mono);text-align:right}

/* switch */
.switch{width:52px;height:44px;display:grid;place-items:center;border:0;background:transparent;padding:0}
.switch span{width:42px;height:24px;border-radius:12px;background:var(--line-2);display:flex;padding:3px;transition:background .15s}
.switch span::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] span{background:var(--st-available)}
.switch[aria-pressed="true"] span::after{transform:translateX(18px)}
.setting{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.setting .d{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:46px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);font-weight:400;font-size:14px;color:var(--text)}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.server{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.server .name{font:700 16px var(--mono)}
.server .url{font:12px var(--mono);color:var(--muted)}
.server dl{flex:2 1 380px;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:13px}
.server dt{color:var(--faint)}.server dd{margin:2px 0 0}
.choice{min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding:12px 16px;border-radius:12px;border:1px solid var(--line-2);background:transparent;text-align:left}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--hover)}
.choice b{font-size:15px}.choice span{font-size:13px;color:var(--muted)}
.settings-nav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.settings-nav a{min-height:40px;display:flex;align-items:center;padding:0 14px;border-radius:8px;color:var(--muted);font-size:14px}
.settings-nav a:hover{background:var(--hover);text-decoration:none}


/* base discover hero */
.base-hero{display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:flex-end;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.base-hero .cmd{margin:0;font:13px var(--mono);color:var(--faint)}
.base-hero h1{font-size:clamp(34px,4.4vw,54px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:12px 0 14px}
.base-hero h1 span{color:var(--accent)}
.bh-copy{flex:1 1 440px;max-width:660px}
.base-hero .blurb{margin:0 0 22px;color:var(--muted);max-width:56ch}
.bh-cta{display:flex;gap:12px;flex-wrap:wrap}
.bh-stats{flex:1 1 380px;max-width:520px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bh-stats div{padding:18px 20px;background:var(--surface)}
.bh-stats dt{font-size:13px;color:var(--faint)}
.bh-stats dd{margin:4px 0 0;font:700 30px var(--mono)}
.hero.band{margin:0;border:1px solid var(--line);border-radius:16px;min-height:400px}
/* mobile preview */
.phone-wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.phone{position:relative;flex:none;width:390px;max-width:100%;height:844px;border:10px solid #05070C;border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.phone .scr{height:calc(100% - 76px);overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:22px}
.phone .mrow{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.phone .mrow .card{flex:none;width:140px}
.phone .tabs{position:absolute;left:0;right:0;bottom:0;height:76px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--rail);border-top:1px solid var(--line);padding-bottom:10px}
.phone .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--faint)}
.phone .tabs a.on{color:var(--accent)}
.phone .tabs a:hover{text-decoration:none;color:var(--text)}
.notes{flex:1 1 300px;max-width:520px;display:flex;flex-direction:column;gap:14px;color:var(--muted)}
.notes h2{color:var(--text)}

/* modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,7,12,.72);display:flex;justify-content:center;align-items:flex-start;padding:max(64px,env(safe-area-inset-top,0px)) 16px 32px;overflow-y:auto}
.dialog{width:100%;max-width:640px;background:var(--raised);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dialog h2{font-size:18px;font-weight:600}
.dialog .body{padding:20px;display:flex;flex-direction:column;gap:22px}
.dialog footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--hover)}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.opt .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.quota{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px dashed var(--line-2);border-radius:10px;font-size:13px;color:var(--muted)}
.quota .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.quota .bar span{display:block;height:100%;width:30%;background:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:100px;z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:10px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;min-height:76px;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));background:var(--rail);border-top:1px solid var(--line)}
.player .ctrls{display:flex;align-items:center;gap:4px}
.player .play{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--accent);border-radius:50%;background:transparent;color:var(--accent)}
.player .now{flex:0 1 260px;min-width:0;display:flex;align-items:center;gap:12px}
.player .now .txt{min-width:0;display:flex;flex-direction:column}
.player .now b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .now span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{flex:1 1 280px;min-width:0;height:40px;display:flex;align-items:center;gap:2px;overflow:hidden;cursor:pointer;border:0;background:transparent;padding:0}
.wave i{flex:1 0 2px;border-radius:2px;background:var(--line-2)}
.wave i.on{background:var(--accent)}
.player .time{font:12px var(--mono);color:var(--muted);min-width:92px}
.player .src{font-size:12px;color:var(--faint)}

@media (max-width:760px){
  .app{flex-direction:column}

/* ---------- auth screens (layout after the Rekord template's login page) ---------- */

.fl{position:relative;padding-top:18px}
.fl input{width:100%;height:42px;border:0;border-bottom:1px solid #3A4458;background:transparent;color:#E9EEF4;font-size:15px;padding:0;outline:none}

.fl:focus-within::after{transform:scaleX(1)}

.auth .btn{color:#E9EEF4;border-color:#3A4458}
.auth .btn.outline-accent{border-color:#FF1744;color:#FF5C7A;background:transparent}
.auth .btn.outline-accent:hover{background:rgba(255,23,68,.08)}
.auth .err{margin:0;padding:10px 12px;border-radius:8px;background:rgba(240,140,122,.12);color:#F5A493;font-size:14px}

.auth-foot{margin-top:28px;font-size:12px;color:#7F8A9A;text-align:center;max-width:60ch}
.signed-out{width:100%;max-width:560px;text-align:center;align-items:center;border-radius:16px;box-shadow:0 40px 120px rgba(0,0,0,.6)}

/* ---------- account menu ---------- */
.acct-wrap{position:relative}

/* ---------- users & permissions ---------- */
.perm{display:flex;flex-direction:column;gap:2px}

.outcome.wait{border-color:var(--st-pending);color:var(--st-pending)}

/* ---------- settings / admin layout ---------- */
.admin{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
.snav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

.snav a:hover{background:var(--hover);color:var(--text);text-decoration:none}
.snav a[aria-current="page"]{background:var(--hover);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}

.inline{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.field textarea{min-height:140px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);font:13px/1.5 var(--mono);color:var(--text);resize:vertical}
.field.full{grid-column:1/-1}
.field input[readonly]{color:var(--muted);background:var(--hover)}
.copyrow{display:flex;gap:8px}.copyrow input{flex:1;min-width:0}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;align-items:flex-start;gap:12px;padding:8px 2px;cursor:pointer;font-size:14px}

.save-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding-top:6px}

.badge-off{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint)}
.badge-off::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.int{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

/* ---------- scrollbars ---------- */
:root{--sb-track:transparent;--sb-thumb:var(--line-2);--sb-thumb-hover:var(--faint)}
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-thumb:active{background:var(--accent);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
.row::-webkit-scrollbar,.mrow::-webkit-scrollbar,.scroll-x::-webkit-scrollbar,.endpoint::-webkit-scrollbar{height:8px}
.row:hover,.mrow:hover,.scroll-x:hover{--sb-thumb:var(--faint)}
.overlay,.phone .scr,.menu{--sb-thumb:var(--line-2)}
.auth{scrollbar-color:#3A4458 transparent}
.auth ::-webkit-scrollbar-thumb{background:#3A4458;background-clip:padding-box}
.field textarea::-webkit-scrollbar{width:8px}

  var auto=hasPermission([P.AUTO_APPROVE,t.auto],user.perms,{type:'or'});
  if(body.type==='discography'&&settings.discoReview&&!can(user,P.ADMIN))auto=false;
  return {auto:auto};
}
function createRequest(user,body){
  var ev=evaluateRequest(user,body);
  var r={id:nextId++,rel:body.rel,type:body.type,count:body.count,userId:user.id,ago:0,
    status:ev.auto?RS.APPROVED:RS.PENDING,modifiedBy:ev.auto?user.id:null,auto:ev.auto,pct:0};
  REQUESTS.unshift(r);syncMedia(r);return r;
}
function updateStatus(actor,r,action){
  if(!can(actor,P.MANAGE_REQUESTS))throw ReqError('You don’t have permission to manage requests.','permission');
  if(action==='retry'){if(r.status!==RS.FAILED)throw ReqError('Only failed requests can be retried.');r.status=RS.APPROVED;r.pct=0;r.note='';}
  else{
    if(r.status!==RS.PENDING)throw ReqError('Only pending requests can be approved or declined.');
    r.status=action==='approve'?RS.APPROVED:RS.DECLINED;r.pct=0;
  }
  r.modifiedBy=actor.id;r.auto=false;r.modAgo=0;syncMedia(r);
}
function cancelRequest(actor,r){
  if(!(r.userId===actor.id&&r.status===RS.PENDING)&&!can(actor,P.MANAGE_REQUESTS))throw ReqError('You can only cancel your own pending requests.');
  REQUESTS.splice(REQUESTS.indexOf(r),1);var c=byId[r.rel];
  if(c&&r.type!=='tracks')c.status='none';
}
function syncMedia(r){
  var c=byId[r.rel];if(!c)return;
  if(r.type==='tracks'){if(r.status===RS.COMPLETED){CTRL_TRACKS.forEach(function(t){t[4]=1;});c.status='available';}return;}
  c.status=r.status===RS.PENDING?'pending':r.status===RS.APPROVED?'processing':r.status===RS.COMPLETED?'available':'none';
}

/* ======================= binding helpers ======================= */
function walk(path){var parts=path.split('.'),root;var h=parts.shift();
  if(h==='S')root=settings;else if(h.charAt(0)==='U')root=userById(+h.slice(1));else return [null,null];
  for(var i=0;i<parts.length-1;i++)root=root[parts[i]];return [root,parts[parts.length-1]];}
function getB(path){var w=walk(path);return w[0]?w[0][w[1]]:'';}
function setB(path,v){var w=walk(path);if(w[0])w[0][w[1]]=v;}
function fText(b,label,o){o=o||{};var v=o.value!==undefined?o.value:getB(b);
  return '<label class="field'+(o.full?' full':'')+'">'+label+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'<input type="'+(o.type||'text')+'"'+(b?' data-bind="'+b+'"':'')+(o.id?' id="'+o.id+'"':'')+' value="'+esc(v==null?'':v)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.ro?' readonly':'')+(o.auto?' autocomplete="'+o.auto+'"':'')+'></label>';}
function fSelect(b,label,opts,o){o=o||{};var v=o.value!==undefined?o.value:getB(b);
  return '<label class="field'+(o.full?' full':'')+'">'+label+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'<select'+(b?' data-bind="'+b+'"':'')+(o.id?' id="'+o.id+'"':'')+'>'+opts.map(function(p){return '<option value="'+esc(p[0])+'"'+(String(p[0])===String(v)?' selected':'')+'>'+esc(p[1])+'</option>';}).join('')+'</select></label>';}
function fArea(b,label,o){o=o||{};return '<label class="field full">'+label+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'<textarea data-bind="'+b+'" spellcheck="false">'+esc(getB(b)||'')+'</textarea></label>';}
function fSwitch(b,label,desc){var v=!!getB(b);return '<div class="setting"><div class="grow"><b style="font-weight:600">'+label+'</b>'+(desc?'<span class="d">'+desc+'</span>':'')+'</div><button class="switch" type="button" data-act="flip" data-bind="'+b+'" aria-pressed="'+v+'" aria-label="'+esc(label)+'"><span></span></button></div>';}
function fChecks(b,list){var arr=getB(b)||[];return '<div class="checks">'+list.map(function(c){return '<label><input type="checkbox" data-bind-arr="'+b+'" value="'+esc(c[0])+'"'+(arr.indexOf(c[0])>-1?' checked':'')+'><span>'+c[1]+(c[2]?'<small>'+c[2]+'</small>':'')+'</span></label>';}).join('')+'</div>';}
function fMap(b,label){var m=getB(b);return '<div class="checks">'+Object.keys(m).map(function(k){return '<label><input type="checkbox" data-bind-map="'+b+'" value="'+esc(k)+'"'+(m[k]?' checked':'')+'><span>'+esc(k)+'</span></label>';}).join('')+'</div>';}

document.addEventListener('click',function(e){

      try{updateStatus(u,r,a);toast((a==='approve'?'Approved ':a==='decline'?'Declined ':'Retrying ')+reqTitle(r)+(a==='decline'?'.':'. Sent to Lidarr.'));}catch(err){toast(err.message,true);}render(true);break;

      state.importResult=null;render(true);toast([ok?ok+' approved automatically':'',wait?wait+' waiting for approval':'',bad.length?bad.length+' not requested: '+bad[0]:''].filter(Boolean).join(', ')+'.',!!bad.length&&!ok&&!wait);break;

      var pool=kind==='Plex'?PLEX_POOL:JELLY_POOL;emails.forEach(function(em){addUserFrom(pool.filter(function(p){return p.email===em;})[0],kind);});
      closeModal();render(true);toast(emails.length?'Imported '+emails.length+' '+kind+' user'+(emails.length>1?'s':'')+' with the default permissions.':'Nothing to import.');break;
    case 'bulk-edit':openBulkEdit();break;
    case 'bulk-save':var bv=readPerms(document.getElementById('permEd')),ids=Object.keys(state.selected).filter(function(k){return state.selected[k];}).map(Number);
      ids.forEach(function(i){if(i!==1)userById(i).perms=bv;});state.selected={};closeModal();render(true);toast('Saved permissions for '+ids.length+' user'+(ids.length>1?'s':'')+'.');break;
    case 'delete-user':openDeleteUser(userById(+b.dataset.id));break;
    case 'delete-user-confirm':target=userById(+b.dataset.id);USERS.splice(USERS.indexOf(target),1);for(var k=REQUESTS.length-1;k>=0;k--)if(REQUESTS[k].userId===target.id)REQUESTS.splice(k,1);
      delete state.selected[target.id];closeModal();location.hash='#/users';render(true);toast('Deleted '+uname(target)+'.');break;
    case 'save-perms':target=userById(+b.dataset.id);target.perms=readPerms(document.getElementById('permEd'));render(true);toast('Saved '+uname(target)+'’s permissions.');break;
    case 'save-quota':target=userById(+b.dataset.id);if(target.quota.override){target.quota.album=[+document.getElementById('uq-a').value||0,+document.getElementById('uq-ad').value];target.quota.track=[+document.getElementById('uq-t').value||0,+document.getElementById('uq-td').value];}render(true);toast('Saved request limits.');break;
    case 'save-password':target=userById(+b.dataset.id);var cur=document.getElementById('pw-cur'),pn=document.getElementById('pw-new').value,pc=document.getElementById('pw-con').value,pe=document.getElementById('pw-err');
      if(cur&&!cur.value){pe.innerHTML='<div class="outcome block">Enter your current password.</div>';break;}
      if(pn.length<8){pe.innerHTML='<div class="outcome block">The new password needs at least 8 characters.</div>';break;}
      if(pn!==pc){pe.innerHTML='<div class="outcome block">The passwords don’t match.</div>';break;}
      target.hasPassword=true;render(true);toast('Password saved.');break;
    case 'link':target=userById(+b.dataset.id);target.linked[b.dataset.k]=target.name;render(true);toast('Linked '+b.textContent.replace('Link ','')+'.');break;
    case 'unlink':target=userById(+b.dataset.id);target.linked[b.dataset.k]='';render(true);toast('Unlinked.');break;
    case 'add-app':target=userById(+b.dataset.id);var an=(document.getElementById('ap-name').value||'').trim()||'New app';var pwd=Math.random().toString(36).slice(2,8)+'-'+Math.random().toString(36).slice(2,8)+'-'+Math.random().toString(36).slice(2,8);
      target.appPasswords.push({name:an,created:new Date().toISOString().slice(0,10),last:'never'});render(true);document.getElementById('ap-out').innerHTML='<div class="outcome auto">Password for '+esc(an)+': <b class="mono">'+pwd+'</b>. Copy it now, it won’t be shown again.</div>';break;
    case 'revoke-app':target=userById(+b.dataset.id);var gone=target.appPasswords.splice(+b.dataset.i,1)[0];render(true);toast('Revoked '+gone.name+'.');break;
    /* settings */
    case 'flip':var cur2=!!getB(b.dataset.bind);
      if(!cur2===false&&/^S\.login\.(local|plex|jellyfin)$/.test(b.dataset.bind)){var L=settings.login,cnt=(L.local?1:0)+(L.plex?1:0)+(L.jellyfin?1:0);if(cnt<=1){toast('At least one sign-in method has to stay on.',true);break;}}
      setB(b.dataset.bind,!cur2);render(true);break;
    case 'saved':toast(b.dataset.msg||'Settings saved.');break;
    case 'toast':toast(b.dataset.msg);break;
    case 'copy':try{navigator.clipboard.writeText(b.dataset.v);}catch(err){}toast('Copied to clipboard.');break;
    case 'regen-key':settings.main.apiKey=Array.from({length:32},function(){return '0123456789abcdef'[Math.floor(Math.random()*16)];}).join('');render(true);toast('Made a new API key. Update any scripts that used the old one.');break;
    case 'save-global-quota':settings.globalQuota.album=[+document.getElementById('gq-a').value||0,+document.getElementById('gq-ad').value];settings.globalQuota.track=[+document.getElementById('gq-t').value||0,+document.getElementById('gq-td').value];render(true);toast('Saved global limits.');break;
    case 'add-folder':var nf=(document.getElementById('new-folder').value||'').trim();if(!nf||nf.charAt(0)!=='/'){toast('Enter a folder path that starts with /.',true);break;}settings.stream.local.folders.push(nf);render(true);toast('Added '+nf+'.');break;
    case 'rm-folder':var rf=settings.stream.local.folders.splice(+b.dataset.i,1)[0];render(true);toast('Removed '+rf+'.');break;
    case 'scan':state.scan=state.scan||{};state.scan[b.dataset.k]=0;render(true);break;
    case 'scan-cancel':delete state.scan[b.dataset.k];render(true);toast('Scan cancelled.');break;
    case 'job-run':var jb=JOBS.filter(function(x){return x.id===b.dataset.id;})[0];jb.running=true;render(true);toast(jb.name+' started.');setTimeout(function(){jb.running=false;LOGS.unshift({t:new Date(),lvl:'info',label:'Jobs',msg:jb.name+' finished'});if(location.hash.indexOf('settings/jobs')>-1)render(true);},4000);break;
    case 'job-cancel':var jc=JOBS.filter(function(x){return x.id===b.dataset.id;})[0];jc.running=false;render(true);toast(jc.name+' cancelled.');break;
    case 'flush':var ch=CACHES[+b.dataset.i];ch.hits=0;ch.misses=0;ch.keys=0;render(true);toast('Cleared the '+ch.name+' cache.');break;
    case 'log-pause':state.logPaused=!state.logPaused;render(true);break;
    case 'issue':toast('Problem reports are coming in a later version.');break;
    case 'play':setPlaying(true);break;
    case 'play-track':setNow(b.dataset.t,b.dataset.a);setPlaying(true);break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(document.querySelector('.plex-pop')){closeModal();state.plexBusy=false;render(false);}else if(document.querySelector('.overlay'))closeModal();closeMenu();}
  if(e.key==='/'&&state.user&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault();document.getElementById('q').focus();}
});

/* ======================= simulations ======================= */
setInterval(function(){
  var changed=false;
  REQUESTS.forEach(function(r){
    if(r.status!==RS.APPROVED)return;
    r.pct=Math.min(100,r.pct+5+Math.floor(Math.random()*9));changed=true;
    if(r.pct>=100){r.status=RS.COMPLETED;syncMedia(r);LOGS.unshift({t:new Date(),lvl:'info',label:'Lidarr',msg:'Imported “'+reqTitle(r)+'”'});if(state.user&&r.userId===state.user.id)toast(reqTitle(r)+' is now in your library.');}
  });
  if(state.scan){Object.keys(state.scan).forEach(function(k){state.scan[k]+=12;if(state.scan[k]>=100){delete state.scan[k];toast('Library scan finished.');}});}
  var onScan=state.scan&&location.hash.indexOf('#/settings/')===0;
  if(state.user&&!document.querySelector('.overlay')&&(((changed&&['requests','album'].indexOf(route())>-1))||onScan))render(true);
},2500);
setInterval(function(){
  if(state.logPaused)return;var l=LOG_LABELS[Math.floor(Math.random()*LOG_LABELS.length)];LOGS.unshift({t:new Date(),lvl:l[0],label:l[1],msg:l[2]});
  if(LOGS.length>200)LOGS.pop();
  if(state.user&&location.hash.indexOf('#/settings/logs')===0&&!document.querySelector('.overlay')&&document.activeElement.id!=='ls')render(true);
},4000);

/* ======================= theme ======================= */
document.getElementById('themeBtn').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  var next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('shufflerr-theme',next);}catch(err){}
});
try{var saved=localStorage.getItem('shufflerr-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);}catch(err){}

/* ======================= player ======================= */
var BARS=96,pos=0.35,playing=false,dur=203,timer=null,wave=document.getElementById('wave');
var hs=[];for(var i=0;i<BARS;i++){hs.push(Math.round(Math.min(1,0.25+0.75*Math.abs(Math.sin(i*0.37)*0.6+Math.sin(i*1.13)*0.3+Math.sin(i*0.07)*0.25))*100));}
wave.innerHTML=hs.map(function(h){return '<i style="height:'+h+'%"></i>';}).join('');
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function paint(){var on=Math.floor(pos*BARS);wave.querySelectorAll('i').forEach(function(el,i){el.classList.toggle('on',i<on);});document.getElementById('time').textContent=fmt(pos*dur)+' / '+fmt(dur);}
function setPlaying(p){playing=p;document.getElementById('playBtn').setAttribute('aria-label',p?'Pause':'Play');
  document.getElementById('playIcon').innerHTML=p?'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  clearInterval(timer);if(p){timer=setInterval(function(){pos+=1/dur;if(pos>=1)pos=0;paint();},1000);}}
function setNow(t,a){document.getElementById('nowTitle').textContent=t;document.getElementById('nowArtist').textContent=a;pos=0;paint();}
document.getElementById('playBtn').addEventListener('click',function(){setPlaying(!playing);});
wave.addEventListener('click',function(e){var rc=wave.getBoundingClientRect();pos=Math.max(0,Math.min(1,(e.clientX-rc.left)/rc.width));paint();});
paint();

/* ======================= boot ======================= */
try{var sid=localStorage.getItem('shufflerr-session');if(sid&&userById(+sid))state.user=userById(+sid);}catch(err){}
document.getElementById('q').value=state.search;
render(false);
})();

</script>
</body>
