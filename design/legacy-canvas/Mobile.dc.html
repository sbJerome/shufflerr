<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shufflerr — Mobile Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C101B}
a{color:#FF5C7A;text-decoration:none}a:hover{color:#FF8FA3}
input::placeholder{color:#7F8A9A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0C101B; color: #E9EEF4; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<div style="height: 768px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; padding: 20px 16px 24px; box-sizing: border-box">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" style="display: flex; align-items: center; color: #E9EEF4; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px"><span style="color: {{accent}}">~/</span>shufflerr<span aria-hidden="true" style="display: inline-block; width: 9px; height: 18px; margin-left: 4px; background: {{accent}}"></span></a>
<button type="button" aria-label="Account menu" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #283143; border-radius: 6px; background: transparent; color: #7FE0D2; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">AD</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #141A26; border: 1px solid #283143; border-radius: 6px">
<label for="mq" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{accent}}">&gt;</label>
<input id="mq" type="search" placeholder="search music…" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #E9EEF4; font-family: inherit; font-size: 16px">
</div>

<section aria-labelledby="m-trend" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="m-trend" style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #E9EEF4">Trending</h2>
<div style="display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
<sc-for list="{{trending}}" as="a" hint-placeholder-count="4">
<a href="Album.dc.html" style="flex: none; width: 140px; display: flex; flex-direction: column; gap: 8px; color: #E9EEF4">
<span style="position: relative; display: block; width: 140px; height: 140px; border-radius: 4px; overflow: hidden; background: {{a.bg}}">
<span aria-hidden="true" style="position: absolute; inset: 0; display: grid; place-items: center; color: {{a.ink}}; opacity: 0.6"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></span>
<span aria-hidden="true" style="position: absolute; left: 8px; bottom: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: {{a.ink}}">COVER ART</span>
<span style="position: absolute; left: 8px; top: 8px; padding: 2px 6px; border-radius: 3px; background: rgba(11,13,12,0.85); color: {{a.st.c}}; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em">{{a.st.l}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.title}}</span><span style="font-size: 12px; color: #9CA8B0">{{a.artist}}</span></span>
</a>
</sc-for>
</div>
</section>

<section aria-labelledby="m-mine" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 id="m-mine" style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #E9EEF4">My requests</h2>
<a href="Requests.dc.html" style="font-family: 'JetBrains Mono', monospace; font-size: 12px">all →</a>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid #1E2636; border-radius: 6px; overflow: hidden">
<sc-for list="{{mine}}" as="q" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #171D2A">
<span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 3px; background: {{q.bg}}; display: grid; place-items: center; color: {{q.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.title}}</span><span style="font-size: 12px; color: #9CA8B0">{{q.artist}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{q.st.c}}">{{q.st.l}}</span>
</li>
</sc-for>
</ul>
</section>

<div style="padding: 14px; border: 1px dashed #283143; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9CA8B0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><span>weekly quota</span><span><span style="color: #E9EEF4">7</span> / 10 left</span></div>
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #1E2636; overflow: hidden"><div style="width: 30%; height: 100%; background: {{accent}}"></div></div>
</div>
</div>

<nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #10151F; border-top: 1px solid #1E2636; padding-bottom: 12px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; font-family: 'JetBrains Mono', monospace; font-size: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>discover</a>
<a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9CA8B0; font-family: 'JetBrains Mono', monospace; font-size: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>search</a>
<a href="Requests.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9CA8B0; font-family: 'JetBrains Mono', monospace; font-size: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>requests</a>
<a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9CA8B0; font-family: 'JetBrains Mono', monospace; font-size: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF1744","options":["#FF1744","#F5B83D","#5FD3C6","#9DB4FF"]},"$preview":{"width":390,"height":844}}'>
var ST={available:{l:'AVAILABLE',c:'#5FD3C6'},partial:{l:'PARTIAL',c:'#7FD08A'},processing:{l:'PROCESSING',c:'#9DB4FF'},pending:{l:'PENDING',c:'#F5B83D'},declined:{l:'DECLINED',c:'#F08C7A'},none:{l:'NOT REQUESTED',c:'#7F8A9A'}};
var PAL=[['#2B3A35','#7FE0D2'],['#3A2E22','#F5B83D'],['#232A3A','#9DB4FF'],['#382328','#F08C7A'],['#2E3322','#C8E07A'],['#30263A','#D2A6F5'],['#1F2E2E','#E9EEF4'],['#3A3520','#F2E3A0']];
function glyph(t){return t.replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function al(t,a,s,p){var c=PAL[p%PAL.length];return {title:t,artist:a,st:ST[s],bg:c[0],ink:c[1],glyph:glyph(t)};}
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF1744',
      trending: [al('Ashes & Arcades','The Marrow Kings','none',5),al('Afterimage Club','Neon Lagoon','processing',4),al('Salt Lines','Vera Okafor','pending',2),al('Paper Moons','Kiri Sato','none',0)],
      mine: [al('Salt Lines','Vera Okafor','pending',2),al('CTRL ESCAPE','John Summit','processing',0),al('Copper Sun','Kiri Sato','available',1),al('Ghost Signals (Live)','Pale Atlas','declined',7)]
    };
  }
}
</script>
</body>
</html>
