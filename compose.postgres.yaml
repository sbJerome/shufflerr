# Shufflerr with PostgreSQL. `docker compose -f compose.postgres.yaml up -d`
services:
  shufflerr:
    build:
      context: .
    image: shufflerr:local
    container_name: shufflerr
    ports:
      - '5055:5055'
    environment:
      TZ: 'UTC'
      LOG_LEVEL: 'info'
      DB_TYPE: 'postgres' # The default is "sqlite"
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      DB_USER: 'shufflerr'
      DB_PASS: 'change-me' # Change this (and POSTGRES_PASSWORD below)
      DB_NAME: 'shufflerr'
      DB_LOG_QUERIES: 'false'
      DB_USE_SSL: 'false'
      DB_POOL_SIZE: '10'
    volumes:
      - ./config:/app/config
      # - /path/to/music:/music:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:5055/api/v1/status >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: shufflerr
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: shufflerr
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shufflerr -d shufflerr']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres:
